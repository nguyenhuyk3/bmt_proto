syntax = "proto3";

package showtime;

option go_package = "./;showtime";

service Showtime {
    rpc GetSomeInformationForTicket(GetSomeInformationForTicketReq) returns (GetSomeInformationForTicketRes);
}

message GetSomeInformationForTicketReq {
    int32 showtimeId = 1;
    repeated int32 seatIds = 2;
}

message GetSomeInformationForTicketRes {
    string cinemaName = 1;
    string city = 2;
    string roomName = 3;
    string seats = 4;
    int32 filmId = 5;
}



